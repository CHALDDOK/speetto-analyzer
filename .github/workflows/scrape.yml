name: 스피또 데이터 자동 수집

on:
  schedule:
    # 정각은 GitHub 예약 실행이 몰려 지연이 커서 7분으로 둔다
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 데이터 수집 실행
        run: python scraper/scrape.py

      - name: 조건 알림 (텔레그램)
        run: python scraper/notify.py

      - name: 수집 실패 알림 (텔레그램)
        if: failure()
        run: python scraper/notify.py --failure

      - name: 결과 저장
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/*.json alerts/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
